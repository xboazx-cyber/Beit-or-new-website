  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Assistant:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brown-dark:#2C4A36;--brown-mid:#3D6147;--copper:#6B9E62;
      --copper-light:#A3C49B;--sage:#5A8A52;
      --rose:#B8705A;--rose-light:#D4A090;--rose-pale:#F0E4DF;
      --cream:#F5EFE6;--cream-mid:#EDE8DC;--cream-dark:#D5CBBB;
      --text:#1E3324;--text-light:#527A5A;
    }
    html { scroll-behavior: smooth; }
    body { font-family:'Assistant',sans-serif; background:var(--cream); color:var(--text); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
    [lang="en"] body { font-family:'Assistant',sans-serif; }

    .container { max-width:1140px; margin:0 auto; padding:0 40px; }
    .divider { display:flex; align-items:center; gap:16px; justify-content:center; margin:20px 0; }
    .divider span { display:block; width:48px; height:0.75px; background:var(--copper-light); }
    .divider .dot { width:5px; height:5px; border-radius:50%; background:var(--copper); flex-shrink:0; }
    .eyebrow { font-size:12.5px; font-weight:500; letter-spacing:0.3em; text-transform:uppercase; color:#4a7a42; }

    /* NAV */
    nav { position:fixed; top:0; left:0; right:0; z-index:100; padding:22px 0; transition:background .4s,padding .4s,box-shadow .4s; }
    nav.scrolled { background:rgba(245,239,230,0.97); backdrop-filter:blur(12px); padding:14px 0; box-shadow:0 1px 0 var(--cream-dark); }
    nav .container { display:flex; align-items:center; justify-content:space-between; }
    .nav-logo { display:flex; align-items:center; gap:12px; text-decoration:none; }
    .nav-logo svg { width:40px; height:40px; direction:ltr; unicode-bidi:isolate; }
    .nav-logo-text { font-family:'Rubik',sans-serif; font-size:20px; font-weight:400; color:var(--brown-dark); letter-spacing:0.05em; }
    [lang="en"] .nav-logo-text { font-family:'Rubik',sans-serif; letter-spacing:0.08em; }
    .nav-right { display:flex; align-items:center; gap:28px; }
    .nav-links { display:flex; align-items:center; gap:32px; list-style:none; }
    .nav-links a { font-size:11px; font-weight:300; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-light); text-decoration:none; transition:color .2s; }
    .nav-links a:hover { color:var(--copper); }
    .nav-cta { font-size:11px !important; font-weight:400 !important; color:var(--cream) !important; background:var(--brown-dark); padding:10px 22px; border-radius:1px; transition:background .2s !important; }
    .nav-cta:hover { background:var(--brown-mid) !important; }
    /* HAMBURGER */
    .hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; padding:6px; background:none; border:none; }
    .hamburger span { display:block; width:22px; height:1.5px; background:var(--text); transition:transform .3s,opacity .3s; }
    .hamburger.open span:nth-child(1){ transform:translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2){ opacity:0; }
    .hamburger.open span:nth-child(3){ transform:translateY(-6.5px) rotate(-45deg); }
    .mobile-menu { display:none; position:fixed; inset:0; top:60px; background:var(--cream); z-index:99; padding:32px 24px; flex-direction:column; gap:8px; }
    .mobile-menu.open { display:flex; }
    .mobile-menu a { font-size:18px; font-weight:300; color:var(--text); text-decoration:none; padding:14px 0; border-bottom:0.75px solid var(--cream-dark); letter-spacing:0.05em; }
    .mobile-menu a:last-child { border-bottom:none; }
    .mobile-menu .mobile-cta { margin-top:16px; display:inline-block; text-align:center; font-size:13px; font-weight:400; letter-spacing:0.2em; text-transform:uppercase; color:var(--cream); background:var(--brown-dark); padding:15px 32px; border:none; border-bottom:none!important; border-radius:1px; }
    @media(max-width:900px){ .hamburger{display:flex;} }

    .lang-toggle { display:flex; gap:0; border:0.75px solid var(--cream-dark); border-radius:1px; overflow:hidden; }
    .lang-btn { background:none; border:none; cursor:pointer; font-family:'Assistant',sans-serif; font-size:10px; font-weight:400; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-light); padding:7px 12px; transition:background .2s,color .2s; }
    .lang-btn.active { background:var(--brown-dark); color:white; }
    .nav-socials { display:flex; gap:14px; align-items:center; }
    .nav-socials a { color:var(--text-light); transition:color .2s; display:flex; }
    .nav-socials a:hover { color:var(--copper); }

    /* HERO */
    .hero { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; overflow:hidden; background:var(--cream); padding:120px 40px 80px; }
    .hero-deco-img { position:absolute; pointer-events:none; mix-blend-mode:multiply; }
    .hero-deco-img.deco-br { bottom:-40px; left:-60px; width:420px; opacity:0.55; transform:rotate(10deg); }
    .about-deco { position:absolute; bottom:-30px; left:-50px; width:280px; opacity:0.50; mix-blend-mode:multiply; pointer-events:none; transform:rotate(-8deg); }
    [dir="rtl"] .about-deco { left:auto; right:-50px; transform:rotate(8deg); }
    .philosophy-deco { position:absolute; bottom:-20px; right:-30px; width:360px; opacity:0.55; mix-blend-mode:multiply; pointer-events:none; }
    [dir="rtl"] .philosophy-deco { right:auto; left:-30px; }
    .testi-deco { position:absolute; bottom:-20px; left:20px; width:260px; opacity:0.18; mix-blend-mode:multiply; pointer-events:none; }
    [dir="rtl"] .testi-deco { left:auto; right:20px; }
    .contact-deco { position:absolute; top:40px; left:-40px; width:200px; opacity:0.35; mix-blend-mode:multiply; pointer-events:none; }
    [dir="rtl"] .contact-deco { left:auto; right:-40px; }
    .hero-bg { position:absolute; inset:0; background:radial-gradient(ellipse 80% 70% at 50% 20%,rgba(237,232,220,.98) 0%,transparent 65%),radial-gradient(ellipse 60% 50% at 80% 80%,rgba(184,112,90,.06) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 20% 70%,rgba(107,158,98,.06) 0%,transparent 60%); pointer-events:none; }
    .hero::before { content:''; position:absolute; inset:0; background:url('brand_assets/backgrounds/מרווה לרגע.jpeg') center/cover no-repeat; opacity:0.04; pointer-events:none; }
    .hero-deco { position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; overflow:hidden; }
    .hero-deco svg { position:absolute; opacity:.1; }
    .hero-deco .deco-l { left:-60px; top:50%; transform:translateY(-50%); width:280px; }
    .hero-deco .deco-r { right:-60px; top:50%; transform:translateY(-50%) scaleX(-1); width:280px; }
    .hero-content { position:relative; z-index:1; max-width:720px; }
    .hero-logo { width:148px; height:148px; margin:0 auto 32px; filter:drop-shadow(0 8px 32px rgba(124,72,48,.12)); animation:fadeUp 1s ease both; direction:ltr; unicode-bidi:isolate; }
    .hero h1 { font-family:'Rubik',sans-serif; font-weight:300; font-size:clamp(42px,7vw,76px); line-height:1.1; letter-spacing:0.02em; color:var(--brown-dark); animation:fadeUp 1s .2s ease both; margin-bottom:8px; }
    [lang="en"] .hero h1 { font-family:'Rubik',sans-serif; letter-spacing:0.04em; }
    .hero h1 em { font-style:italic; color:var(--rose); }
    .hero-sub { font-family:'Rubik',sans-serif; font-size:20px; font-weight:300; color:var(--copper-light); letter-spacing:0.15em; display:block; margin-bottom:24px; animation:fadeUp 1s .28s ease both; }
    [lang="en"] .hero-sub { font-family:'Rubik',sans-serif; }
    .hero p { font-size:15px; font-weight:300; line-height:2; color:var(--text-light); max-width:520px; margin:0 auto 36px; animation:fadeUp 1s .35s ease both; }
    .hero-eyebrow { animation:fadeUp 1s .15s ease both; margin-bottom:14px; }
    .hero-actions { display:flex; align-items:center; justify-content:center; gap:24px; animation:fadeUp 1s .45s ease both; flex-wrap:wrap; }
    .btn-primary { display:inline-block; font-size:11px; font-weight:400; letter-spacing:0.24em; text-transform:uppercase; color:var(--cream); background:var(--brown-dark); padding:16px 36px; border-radius:1px; text-decoration:none; transition:background .25s,transform .2s; }
    .btn-primary:hover { background:var(--brown-mid); transform:translateY(-1px); }
    .btn-secondary { display:inline-flex; align-items:center; gap:10px; font-size:11px; font-weight:300; letter-spacing:0.24em; text-transform:uppercase; color:var(--text-light); text-decoration:none; transition:color .2s; }
    .btn-secondary:hover { color:var(--copper); }
    .btn-secondary::after { content:''; display:block; width:28px; height:1px; background:currentColor; transition:width .2s; }
    .btn-secondary:hover::after { width:40px; }
    [dir="rtl"] .btn-secondary { flex-direction:row-reverse; }
    .scroll-hint { position:absolute; bottom:32px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; animation:fadeUp 1.2s .8s ease both; }
    .scroll-hint span { font-size:9px; letter-spacing:0.36em; text-transform:uppercase; color:var(--copper-light); }
    .scroll-line { width:1px; height:36px; background:linear-gradient(to bottom,var(--copper-light),transparent); animation:scrollPulse 2s infinite; }

    /* STRIP */
    .intro-strip { background:var(--brown-dark); padding:26px 0; overflow:hidden; }
    .strip-track { display:flex; gap:52px; animation:marquee 28s linear infinite; white-space:nowrap; }
    .strip-item { display:flex; align-items:center; gap:18px; flex-shrink:0; }
    .strip-item span { font-size:10.5px; font-weight:300; letter-spacing:0.28em; text-transform:uppercase; color:rgba(255,255,255,.6); }
    .strip-dot { width:4px; height:4px; border-radius:50%; background:var(--copper); flex-shrink:0; }

    /* ABOUT */
    .about { padding:120px 0; }
    .about .container { display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center; }
    [dir="rtl"] .about .container { direction:rtl; }
    .about-img { width:100%; aspect-ratio:4/5; background:url('brand_assets/backgrounds/ליקוטים על עץ .jpeg') center/cover no-repeat; border-radius:2px; position:relative; overflow:hidden; border:1px solid var(--cream-dark); }
    .about-img::after { content:''; position:absolute; inset:0; background:linear-gradient(to top,rgba(44,74,54,.35) 0%,transparent 60%); }
    .about-visual { position:relative; }
    .about-img-badge { position:absolute; bottom:-24px; right:-24px; width:110px; height:110px; background:var(--rose-pale); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 32px rgba(184,112,90,.15); }
    [dir="rtl"] .about-img-badge { right:auto; left:-24px; }
    .about-img-badge svg { width:75px; height:75px; }
    .about-text .eyebrow { margin-bottom:18px; }
    .about-text h2 { font-family:'Rubik',sans-serif; font-weight:300; font-size:clamp(30px,4vw,44px); line-height:1.2; color:var(--brown-dark); margin-bottom:22px; }
    [lang="en"] .about-text h2 { font-family:'Rubik',sans-serif; }
    .about-text h2 em { font-style:italic; color:var(--copper); }
    .about-text p { font-size:14px; font-weight:300; line-height:2; color:var(--text-light); margin-bottom:16px; }
    .about-stats { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:36px; padding-top:32px; border-top:0.75px solid var(--cream-dark); }
    .stat-num { font-family:'Rubik',sans-serif; font-size:40px; font-weight:300; color:var(--copper); line-height:1; }
    [lang="en"] .stat-num { font-family:'Rubik',sans-serif; }
    .stat-label { font-size:11px; font-weight:300; letter-spacing:0.18em; color:var(--text-light); margin-top:5px; text-transform:uppercase; }

    /* SERVICES */
    .services { padding:120px 0; background:var(--cream-mid); }
    .section-head { text-align:center; margin-bottom:56px; }
    .section-head h2 { font-family:'Rubik',sans-serif; font-weight:300; font-size:clamp(28px,4vw,44px); color:var(--brown-dark); margin:14px 0 0; }
    [lang="en"] .section-head h2 { font-family:'Rubik',sans-serif; }
    .services-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
    .service-card { background:var(--cream); padding:22px 18px 18px; border-radius:2px; position:relative; overflow:hidden; transition:transform .3s,box-shadow .3s; }
    .service-card:hover { transform:translateY(-4px); box-shadow:0 16px 48px rgba(92,53,32,.08); }
    .service-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--copper); transform:scaleX(0); transition:transform .3s; transform-origin:left; }
    [dir="rtl"] .service-card::before { transform-origin:right; }
    .service-card:hover::before { transform:scaleX(1); }
    .service-card.featured { background:var(--brown-dark); }
    .service-card.featured h3 { color:rgba(255,255,255,.92); }
    .service-card.featured p { color:rgba(255,255,255,.55); }

    .service-card.featured .service-link { color:var(--copper-light); }
    .service-card.featured::before { background:var(--copper-light); }
    .service-icon { width:32px; height:32px; margin-bottom:14px; color:var(--copper); }
    .service-card.featured .service-icon { color:var(--copper-light); }
    .service-num { position:absolute; top:16px; right:16px; font-family:'Rubik',sans-serif; font-size:32px; font-weight:300; color:var(--cream-dark); line-height:1; }
    [dir="rtl"] .service-num { right:auto; left:16px; }
    [lang="en"] .service-num { font-family:'Rubik',sans-serif; }

      {q:'האם דיקור סיני כואב?', a:'המחטים דקות מאוד (דקות הרבה יותר ממחט רגילה) ורוב האנשים כמעט ולא מרגישים אותן. תחושה נפוצה היא עקצוץ קל, חום או כובד — סימנים לכך שהאנרגיה מתחילה לזוז.'},
      {q:'האם ניתן לשלב בין דיקור סיני לתרופות קונבנציונליות?', a:'כן. הרפואה הסינית עובדת בצורה מושלמת לצד הטיפול הרפואי המערבי. חשוב ליידע את המטפל על כל התרופות שאתם נוטלים.'},
      {q:'מה ההבדל בין שיאצו לעיסוי רגיל?', a:'שיאצו הוא לא סתם עיסוי — הוא שיטת ריפוי מלאה המבוססת על הרפואה הסינית. עובדים עם נקודות לחץ ספציפיות לאורך מרידיאני האנרגיה, לא רק עם שרירים. מטרתו לאזן את מערכות הגוף מבפנים.'},
      {q:'כיצד קובעים פגישה?', a:'ניתן לפנות אלינו דרך טופס הצור קשר באתר, בטלפון/ווצאפ 054-5222209 או במייל xboazx@gmail.com. נשמח לענות על כל שאלה ולמצוא את הזמן המתאים לכם.'}

    blog_eyebrow:'מאמרים', blog_title:'קצת ידע לדרך',
    blog1_tag:'רפואה סינית', blog1_title:'מה זה דיקור סיני ואיך הוא עובד?', blog1_body:'דיקור סיני הוא ענף מרכזי ברפואה הסינית המסורתית, הנהוג כבר למעלה מ-2,500 שנה. הטיפול מבוסס על הכנסת מחטים דקות לנקודות ספציפיות לאורך מסלולי אנרגיה (מרידיאנים) בגוף, במטרה לשחרר חסימות ולהחזיר את זרימת האנרגיה החיונית לאיזון. דיקור סיני יעיל לכאבים כרוניים, חרדה, הפרעות שינה, בעיות עיכול ועוד.',
    blog2_tag:'שיאצו', blog2_title:'שיאצו – הריפוי שבמגע', blog2_body:'שיאצו היא שיטת עיסוי יפנית המבוססת על עקרונות הרפואה הסינית המסורתית. המטפל משתמש בלחץ אצבעות, כפות ידיים ומרפקים לאורך מרידיאני האנרגיה בגוף. הטיפול משחרר מתחים, מחזק את מערכת החיסון, מפחית כאבים ומחזיר תחושת שלמות ורוגע עמוק. מתאים לכל גיל ומצב.',
    blog3_tag:'הרבליזם', blog3_title:'צמחי מרפא – הרפואה שבטבע', blog3_body:'הרבליזם קליני הוא שימוש מדעי ומסורתי בצמחי מרפא לטיפול במצבים בריאותיים מגוונים. בבית אור, הפורמולות מותאמות אישית לכל מטופל לאחר הערכה מעמיקה. צמחי המרפא תומכים במערכת החיסון, מווסתים הורמונים, מחזקים את מערכת העצבים ועוד – הכל מהטבע.',

    strip:['קונסטלציה משפחתית','עבודת דמויות','רפואת צמחים','פגישות אישיות','דיקור סיני – גזעים וענפים','שיאצו','הרצאות וסיורי ליקוט'],
    testimonials:[
      { q:'"בועז מטפל בי מינואר 2023. הייתי אז במצב לא טוב פיזי ונפשי. בועז עזר לי בהרבה תחומים, חיזק אותי ודואג לי. אני יכולה להעיד שבועז מאוד מקצועי, רציני, אנושי ולא מלחיץ. אדם שמקשיב, חושב ובודק כל תרופה שאני מקבלת על סמך בדיקות וכל המסמכים הרלוונטיים. אני מקבלת ממנו פורמולות שמתאימות לי באותה תקופה, צמחים לתה ומשחה. ממליצה בחום."', n:'נעמי ר.', l:'', c:'#6B9E62' },
      { q:'"המפגשים שלי עם בועז תמיד מדויקים, בהירים, מלמדים ומועילים. אני מביאה מצבים מחיי היומיום — בקלילות, בעזרת הייצוגים הצבעוניים, אנחנו מעמידים את מה שהעלתי מכל הזוויות. יחד בנינו פאזל של החיים שלי. פרמנו פלונטרים סבוכים בפשטות ונעימות. תודה רבה לך בועז על התמיכה, ההקשבה, ההבנה והרגישות שלך."', n:'שולמית', l:'', c:'#A3C49B' },
      { q:'"זמן רב אני מטופלת של בועז, ובעזרתו הותאמו לי תמציות צמחים שונות העונות לצרכי. בועז מגלה רגישות רבה ומתאים לי את תרכובת הצמחים המתאימה. הידע הרב שלו בתחום הצמחים בא לידי ביטוי בפורמולות שהוא מרכיב במיוחד עבורי. ממליצה בחום."', n:'נורית', l:'', c:'#5A8A52' },
      { q:'"הגעתי לבועז עם מגוון עניינים ובעיות. לאחר אבחון יסודי ומעמיק התחלתי תהליך שכלל שינוי אורח חיים, פורמולות מותאמות וצמחים. התוצאות מדברות בעד עצמן. בועז ליווה אותי ועדיין מלווה ברגישות ובסבלנות. ממליצה בחום."', n:'עליזה מ.', l:'', c:'#2C4A36' },
      { q:'"להגיע לטיפול אצל דריה זה להיכנס למרחב מלא שלווה וקסם. דריה מקשיבה לעומק הלב והגוף, מאתרת את המקומות הזקוקים לריפוי ובידיים מיומנות ויציבות מדקרת, נוגעת ומחזירה את הדברים למקומם. הגעתי לטיפול בדיקור ומהשניות הראשונות הרגשתי שהגעתי למקום הנכון. לא רק מחטים טיפלו בי — גם רגישות וחכמת לב של מטפלת נפלאה עשו את שלהם."', n:'סוזנה ל.', l:'', c:'#6B9E62' },
      { q:'"כאשר הזדמנתי לראשונה לטיפול אצל דריה, ציפיתי להנאה הרגילה של שיאצו. דריה העניקה לי טיפול ברמה נפרדת לגמרי. יומיים-שלושה לאחר כל טיפול הנחתי לגלות שהתחושות הלא נעימות מתרופפות עד נעלמות. כישורי האבחון שלה מאוד יסודיים — לעיתים היא איבחנה פגמים שלא הייתי מודעת להם. המפגשים עם דריה טובים, מהנים, מועילים ואפקטיבים."', n:'ריקי ל.', l:'', c:'#A3C49B' },
      { q:'"מהיום שגיליתי את דריה ידעתי שהגעתי לתחנה שלי. המקצועיות שלה דיברה בעד עצמה — לא היה לי צורך להראות לה את הצרכים שלי, פשוט עצמתי עיניים והתמסרתי למגע שלה. תמיד אני יוצא מהטיפול כמרחף ואומר לה תודה מכל הלב!"', n:'זב שוסו ס.', l:'', c:'#5A8A52' },
      { q:'"לדריה מגע נפלא עם ידיים קסם, הבנה אינטואיטיבית איפה ומה דורש תשומת לב, והיא יודעת להקשיב ולתת טיפ רלוונטי. דריה גם יודעת להשרות אווירה נינוחה שמאפשרת לי לשחרר ולהתמסר. בקיצור — דריה היא המטפלת המושלמת."', n:'ירית ש.', l:'', c:'#2C4A36' },
      { q:'"During the time in my spa I worked with dozens of therapists, but Daria will always stay in my mind as one of my favourites. She has a very intelligent and sensitive way of approaching people. Every client lucky enough to get Daria was impressed and happy, and a personal connection of appreciation was always made. Her professional care is just correct. I recommend her with all my heart."', n:'Yoko K.', l:'', c:'#6B9E62' }
    ]

  en: {
    nav_about:'About', nav_services:'Services', nav_team:'Team', nav_philosophy:'Philosophy', nav_cta:'Book a Session',
    hero_eyebrow:'Holistic Wellness · Karmei Yosef',

    hero_sub:'Body · Mind · Spirit',
    hero_cta:'Book a Session', hero_explore:'Explore', scroll:'Scroll',
    about_eyebrow:'Our Story',
    about_title:'Healing is a gentle <em>returning</em>',
    about_p1:'Beit Or was born from our own desire for movement and healing. The inner processes we walked through over the years led us to keep learning — and to begin accompanying others along their own path.',
    about_p2:'Whether through dialogue or hands-on healing, body and mind always connect together, pointing us toward the right precision and direction — to find renewed balance in the face of life\'s changes and the challenges they bring. We would be glad to accompany you on your path.',
    stat1:'Years of Practice', stat2:'People Supported', stat3:'Healing Modalities', stat4:'Natural Approach',
    services_eyebrow:'What We Offer', services_title:'Our Offerings',
    svc1_title:'Family Constellation', svc1_body:'A powerful therapeutic method developed by Bert Hellinger that reveals hidden dynamics and entanglements passed through generations. It allows you to see your family system from a new perspective and release patterns that have held you back — bringing healing across all generations.',
    svc2_title:'Voice Dialogue', svc2_body:'Developed by Hal and Sidra Stone, Voice Dialogue works with the "selves" — the many sub-personalities within us. Through direct conversation with these parts, a deep awareness develops of how they shape our lives, our choices, and our relationships.',
    svc3_title:'Energy Healing', svc3_body:'Working with the body\'s subtle energy fields to restore balance, release blockages, and support the natural flow of vitality and inner wellbeing.',
    svc4_title:'Plant Medicine', svc4_body:'Personalized herbal consultations and plant medicine protocols drawing from ancient healing traditions and modern botanical knowledge.',
    svc5_title:'Breathwork', svc5_body:'Guided breathwork sessions that activate the body\'s innate healing intelligence, releasing stored tension and expanding conscious awareness.',
    svc6_title:'One-on-One Sessions', svc6_body:'Deeply personalized healing sessions held in a safe, sacred space — tailored precisely to where you are right now and where you wish to be.',
    svc7_title:'Group Circles', svc7_body:'Monthly gatherings and healing circles weaving together community, sound, and shared intention in a held and nourishing space.',
    svc8_title:'Retreats', svc8_body:'Immersive multi-day retreats in nature — a full pause from the ordinary, offering deep rest, restoration, and renewed connection to life.',
    svc9_title:'Acupuncture – Stems & Branches', svc9_body:'Acupuncture using the Stems and Branches system is an ancient and profound branch of Classical Chinese Medicine. It works with a cosmic framework of Ten Heavenly Stems and Twelve Earthly Branches — the vessels through which nature expresses itself in cycles of time and energy. Treatment is precisely calibrated to the individual, the hour, the season, and cosmic timing, enabling deep healing of body, mind, and spirit at the root — not merely the symptom.',
    svc10_title:'Shiatsu', svc10_body:'Shiatsu is an ancient Japanese healing art that combines finger pressure on meridian points with stretches and work with Ki energy. Treatment promotes free energy flow along the body\'s channels, relieves deep tension, strengthens the immune system, and restores a profound sense of balance and wholeness.',
    svc11_title:'Psychiatric Medication Tapering Support', svc11_body:'Compassionate, holistic support for those reducing psychiatric medications — combining Chinese medicine, plant medicine, and emotional accompaniment, in coordination with your physician.',
    svc12_title:'Macrobiotic Nutrition', svc12_body:'Personalised macrobiotic nutritional guidance — harmonising food with season, constitution, and the body\'s natural rhythms to restore balance from within.',
    svc1_detail:'Family Constellation works with the group soul of the family — a system that exists beyond the boundaries of time. Through representatives, hidden dynamics are revealed: unconscious identifications with ancestors, confused fates, and blind love that causes us to carry what is not ours. Treatment brings healing not only to the individual but to the entire family field — generations back and forward. Sessions can be done individually (using figurines) or in a group.',
    svc2_detail:'Character Work identifies and works with the different "selves" within us: the inner critic, the protector, the wounded child, the achiever, and more. Through direct conversation with each part, we develop an "aware centre" — an inner place that can hold and navigate all parts. This process transforms relationship patterns, restores choice, and expands the boundaries of awareness.',
    svc4_detail:'Modern herbalism combines ancient plant wisdom with contemporary phytochemical understanding. Each plant contains hundreds of active compounds working in synergy — unlike isolated pharmaceuticals, the whole plant works with the body, not upon it. We build personalised herbal protocols tailored to your unique constitution, the season, and where you are in your process. Common allies include: ashwagandha, valerian, chamomile, ginkgo, and dozens more.',
    svc6_detail:'The one-on-one session is a held, safe space where you can bring whatever is present — doubts, pain, questions, dreams. We work flexibly with the approach that fits the person and the moment: constellation, character work, body-based work, dialogue, or simply presence. Sessions are held in Karmei Yosef, and online (Zoom) is also available.',
    svc9_detail:'The Stems and Branches system (天干地支) is an ancient cosmic framework at the heart of Classical Chinese Medicine. The Ten Heavenly Stems and Twelve Earthly Branches describe how the Tao expresses itself in nature and the human body according to cycles of time — day, season, year. Acupuncture using this system is calibrated precisely to the moment, the person, and their inner climate, enabling healing at deep levels. Treatment includes a thorough intake before needling.',
    svc10_detail:'Shiatsu (指圧) — meaning "finger pressure" in Japanese — is a bodywork therapy rooted in Japan with origins in Classical Chinese Medicine. The practitioner applies focused pressure using fingers, palms, and elbows on meridian points, using rotations and stretches. Treatment promotes free Ki flow, releases blockages, and restores wholeness. Especially suited for stress, chronic pain, sleep disorders, and fatigue.',
    svc11_detail:'Tapering psychiatric medications (antidepressants, anxiolytics, sleep aids) is a delicate process requiring close accompaniment. At Beit Or we offer a holistic framework combining: Chinese medicine and acupuncture to support the nervous system, herbal medicine to ease withdrawal effects, emotional and somatic work, and close follow-up throughout. We work in coordination with your treating physician and do not replace psychiatric consultation — rather, we create a supportive container for a chosen process.',
    svc12_detail:'Macrobiotics views food not simply as fuel but as a language through which we relate to the universe. Rooted in the philosophy of Yin and Yang and the Five Elements, macrobiotic nutrition adapts what we eat to who we are — our constitution, the current season, our state of health, and our life stage. Sessions include a detailed consultation followed by a personalised nutritional programme integrating whole grains, vegetables, sea vegetables, and traditional fermented foods.',
    svc13_title:'Herb Talks & Foraging Walks', svc13_body:'Talks on medicinal plants and guided foraging walks in nature — a living encounter with the plants growing around us, their properties, and how to use them.',
    svc13_detail:'Boaz Or leads focused foraging walks in the Israeli landscape alongside talks on medicinal plants — from field, garden, and kitchen. Walks suit small groups and offer direct hands-on acquaintance with plants: field identification, respectful harvesting, and preparation methods including teas, tinctures, and oils. Talks are also available for groups, schools, and organisations.',
    svc_link:'Learn more', svc_close:'Close',
    phil_eyebrow:'Our Philosophy',
    phil_quote:'"The body always knows the way home. Our work is simply to listen."',
    pillar1_title:'Wholeness', pillar1_body:'We hold the view that nothing in you is broken. Healing is about remembering your original wholeness, not fixing what is wrong.',
    pillar2_title:'Nature', pillar2_body:'The natural world is our greatest teacher and pharmacy. We draw from its intelligence with reverence, curiosity, and care.',
    pillar3_title:'Presence', pillar3_body:'True healing happens in this moment. We cultivate the art of arriving fully — to the body, the breath, and the life that is already here.',
    prac_eyebrow:'Our Practitioner',
    prac_name:'Daria Porath',
    prac_role:'Chinese Medicine Practitioner, Acupuncture & Shiatsu',
    prac_bio1:'Daria Porath is a Chinese Medicine practitioner and Shiatsu therapist with deep training in Israel and abroad. She began her path studying Zen-Shiatsu in Argentina under Master Eiji Mino, and went on to complete a four-year Chinese Medicine program at Tel Aviv University (Ramat HaSharon campus), specialising in acupuncture, herbal medicine, and nutrition.',
    prac_bio2:'Daria is certified by the Israeli Traditional Chinese Medicine Association and recognised as a senior Shiatsu practitioner. She has recently specialised in the Stems and Branches system — an ancient and profound branch of Classical Chinese Medicine — under Efrat Morsiano. She also brings over a decade of yoga and meditation practice, a yoga teaching certification from the Sivananda organisation in New York, and training in Theta Healing.',
    prac_bio3:'Daria\'s approach seeks to trace the connecting thread between different phenomena and create genuine solutions from the root — while strengthening weakened areas. She accompanies every person with compassion, precision, and full presence, viewing the whole human being across all their dimensions.',
    prac_cred1:'🎓 4-Year Chinese Medicine Degree — Tel Aviv University (Ramat HaSharon)',
    prac_cred2:'🪡 Acupuncture – Stems & Branches System (under Efrat Morsiano)',
    prac_cred3:'🤲 Zen-Shiatsu — under Master Eiji Mino, Argentina',
    prac_cred4:'📜 Israeli Traditional Chinese Medicine Association | Senior Shiatsu Practitioner',
    prac_cred5:'🧘 Yoga Instructor — Sivananda Organisation, New York | Theta Healing',
    prac_cta:'Book a Session with Daria',
    prac_photo_hint:'Add photo here',
    boaz_eyebrow:'Co-founder of Beit Or',
    boaz_name:'Boaz Or',
    boaz_role:'Depth Process Facilitator · Clinical Herbalist',
    boaz_bio1:'Boaz is Daria\'s partner, father to Micha\'el and Liana, a depth process facilitator and clinical herbalist. He weaves together herbalism — foraging, growing, and compounding medicinal plants — with depth process work: Voice Dialogue, Family Constellation, and related healing modalities.',
    boaz_bio2:'He came to the path of enquiry and healing many years ago, out of a personal need to discover and heal himself and those close to him. Since then, he has continued learning and exploring — uncovering ever deeper layers of inner and physical development.',
    boaz_cta:'Book a Session with Boaz',
    boaz_photo_hint:'Add photo here',
    boaz_cred1:'🌿 Clinical Herbalist (Cl.H.) — foraging, cultivation & plant compounding',
    boaz_cred2:'🧭 Graduate of the multi-year programme — Derech HaOmek School',
    boaz_cred3:'🎓 BA in Humanities | MA in Education',
    blog_eyebrow:'Articles', blog_title:'A Little Knowledge for the Journey',
    blog1_tag:'Chinese Medicine', blog1_title:'What is Acupuncture and How Does it Work?', blog1_body:'Acupuncture is a central branch of Traditional Chinese Medicine, practiced for over 2,500 years. Treatment involves inserting fine needles into specific points along energy pathways (meridians) in the body, releasing blockages and restoring the flow of vital energy. Acupuncture is effective for chronic pain, anxiety, sleep disorders, digestive issues and more.',
    blog2_tag:'Shiatsu', blog2_title:'Shiatsu – The Healing Power of Touch', blog2_body:'Shiatsu is a Japanese massage method based on Traditional Chinese Medicine principles. The practitioner uses finger, palm and elbow pressure along the body\'s energy meridians. Treatment releases tension, strengthens the immune system, reduces pain and restores a deep sense of wholeness and calm. Suitable for all ages and conditions.',
    blog3_tag:'Herbal Medicine', blog3_title:'Medicinal Herbs – Nature\'s Medicine', blog3_body:'Clinical herbalism is the scientific and traditional use of medicinal plants to treat a range of health conditions. At Beit Or, formulas are individually tailored to each patient after an in-depth assessment. Herbs support the immune system, regulate hormones, strengthen the nervous system and more — all from nature.',
    nav_blog:'Blog',
    faq_eyebrow:'FAQ', faq_title:'Do You Have Questions?',
    faqs:[
      {q:'How much does an acupuncture treatment cost?', a:'Prices vary depending on the type of treatment and session length. Contact us directly for pricing and terms. We believe healing should be accessible.'},
      {q:'How many treatments until I feel a difference?', a:'Most patients report improvement after 3–5 treatments. Chronic conditions may require a longer series. In the first session we build a personalised treatment plan.'},

let lang = 'he';

function setLang(l) {
  lang = l;
  const html = document.documentElement;
  html.lang = l;
  html.dir = l === 'he' ? 'rtl' : 'ltr';
  document.getElementById('btn-he').classList.toggle('active', l === 'he');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (T[l][key] !== undefined) el.innerHTML = T[l][key];
  });
  buildStrip();
  buildServices();
  buildTestimonials();
  buildFAQ();
  document.querySelector('.nav-logo-text').textContent = l === 'he' ? 'בית אור' : 'Beit Or';
}

function buildFAQ() {
  const list = document.getElementById('faq-list');
  if (!list) return;
  list.innerHTML = T[lang].faqs.map((f,i) => `
    <div class="faq-item">
      <button class="faq-q" onclick="toggleFAQ(${i})" id="faq-btn-${i}">
        <span id="faq-icon-${i}">+</span>${f.q}
      </button>
      <div class="faq-a" id="faq-a-${i}"><p>${f.a}</p></div>
    </div>`).join('');
}

function toggleFAQ(i) {
  const a = document.getElementById('faq-a-'+i);
  const btn = document.getElementById('faq-btn-'+i);
  const isOpen = a.style.maxHeight && a.style.maxHeight !== '0px';
  document.querySelectorAll('.faq-a').forEach(el => el.style.maxHeight = '0px');
  document.querySelectorAll('.faq-q').forEach(el => el.classList.remove('open'));
  if (!isOpen) { a.style.maxHeight = a.scrollHeight + 'px'; btn.classList.add('open'); }
}

function buildStrip() {
  const items = [...T[lang].strip, ...T[lang].strip];
  document.getElementById('strip-track').innerHTML = items.map(s =>
    `<div class="strip-item"><div class="strip-dot"></div><span>${s}</span></div>`
  ).join('');
}

function buildServices() {
  const svcs = [
    { key:'svc1', featured:true,  icon:'<path d="M12 2C8 6 4 8 4 13c0 4.5 3.5 8 8 8s8-3.5 8-8c0-5-4-7-8-11z"/><path d="M12 8v4l3 3"/>' },
    { key:'svc2', featured:true,  icon:'<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>' },
    { key:'svc4', featured:false, icon:'<path d="M12 2C8 6 4 8 4 13c0 4.5 3.5 8 8 8s8-3.5 8-8c0-5-4-7-8-11z"/>' },
    { key:'svc6', featured:false, icon:'<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>' },
    { key:'svc9', featured:true,  icon:'<line x1="12" y1="2" x2="12" y2="22"/><line x1="6" y1="6" x2="18" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="6" y1="18" x2="18" y2="18"/>' },
    { key:'svc10', featured:false, icon:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>' },
    { key:'svc11', featured:false, icon:'<path d="M12 22s-8-4-8-10V5l8-3 8 3v7c0 6-8 10-8 10z"/>' },
    { key:'svc12', featured:false, icon:'<path d="M12 2a10 10 0 100 20A10 10 0 0012 2z"/><path d="M12 6v6l4 2"/>' },
    { key:'svc13', featured:false, icon:'<path d="M12 22V12"/><path d="M5 9l7-7 7 7"/><path d="M9 22V16a3 3 0 016 0v6"/><path d="M3 9h18"/>' },
  ];
  document.getElementById('services-grid').innerHTML = svcs.map((s, i) => {
    const detail = T[lang][s.key+'_detail'] || '';
    return `
    <div class="service-card${s.featured ? ' featured' : ''} reveal">
      <span class="service-num">${String(i+1).padStart(2,'0')}</span>
      <svg class="service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg>
      <h3>${T[lang][s.key+'_title']}</h3>
      <p>${T[lang][s.key+'_body']}</p>
      ${detail ? `
      <div class="svc-expand" style="display:none;">
        <div class="svc-expand-body">${detail}</div>
      </div>
      <button class="service-link" onclick="toggleExpand(this)" type="button">
        <span class="svc-link-text">${T[lang].svc_link}</span> <span class="svc-link-arrow">→</span>
      </button>` : `<a href="#contact" class="service-link">${T[lang].svc_link} <span>→</span></a>`}
    </div>`;
  }).join('');
  observeReveals();
}

let testitIdx = 0;
const TESTI_PER_PAGE = window.innerWidth <= 700 ? 1 : 2;

function buildTestimonials() {
  const items = T[lang].testimonials;
  document.getElementById('testi-grid').innerHTML = items.map(t => `
    <div class="testi-card reveal">
      <div class="testi-stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
      <p>${t.q}</p>
      <div class="testi-author">
        <div class="testi-avatar" style="background:linear-gradient(135deg,${t.c}aa,${t.c})"></div>
        <div><div class="testi-name">${t.n}</div><div class="testi-loc">${t.l}</div></div>
      </div>
    </div>
  `).join('');

  const perPage = window.innerWidth <= 700 ? 1 : 2;
  const totalPages = Math.ceil(items.length / perPage);
  const dots = document.getElementById('testi-dots');
  dots.innerHTML = Array.from({length: totalPages}, (_,i) =>
    `<div class="testi-dot${i===0?' active':''}" data-i="${i}"></div>`
  ).join('');
  dots.querySelectorAll('.testi-dot').forEach(d => d.addEventListener('click', () => goToTesti(+d.dataset.i)));

  document.getElementById('testi-prev').onclick = () => goToTesti(testitIdx - 1);
  document.getElementById('testi-next').onclick = () => goToTesti(testitIdx + 1);

  goToTesti(0);
  observeReveals();
}

function goToTesti(idx) {
  const grid = document.getElementById('testi-grid');
  const cards = grid.querySelectorAll('.testi-card');
  const perPage = window.innerWidth <= 700 ? 1 : 2;
  const totalPages = Math.ceil(cards.length / perPage);
  testitIdx = (idx + totalPages) % totalPages;

  const shiftPct = (testitIdx * perPage / cards.length) * 100;
  const isRTL = document.documentElement.dir === 'rtl';
  grid.style.transform = `translateX(${isRTL ? shiftPct : -shiftPct}%)`;

  document.querySelectorAll('.testi-dot').forEach((d,i) => d.classList.toggle('active', i === testitIdx));
}

function observeReveals() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => {
      if (e.isIntersecting) { setTimeout(() => e.target.classList.add('visible'), i * 80); obs.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal:not(.visible)').forEach(el => obs.observe(el));
}

function toggleExpand(btn) {
  const card = btn.closest('.service-card');
  const panel = card.querySelector('.svc-expand');
  const arrow = btn.querySelector('.svc-link-arrow');
  const open = panel.style.display === 'block';
  panel.style.display = open ? 'none' : 'block';
  arrow.textContent = open ? '→' : '↑';
  if (!open) card.querySelector('.svc-link-text').textContent = T[lang].svc_close || (lang==='he'?'סגור':'Close');
  else card.querySelector('.svc-link-text').textContent = T[lang].svc_link;
}

function toggleMenu() {
  const h = document.getElementById('hamburger');
  const m = document.getElementById('mobile-menu');
  h.classList.toggle('open');
  m.classList.toggle('open');
}

// Navbar scroll
document.getElementById('contact-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('form-submit-btn');
  const success = document.getElementById('form-success');
  const error = document.getElementById('form-error');
  const recaptcha = grecaptcha.getResponse();
  if (!recaptcha) { error.style.display = 'block'; return; }
  btn.disabled = true;
  success.style.display = 'none';
  error.style.display = 'none';
  try {
    const formData = new FormData(this);
    formData.delete('g-recaptcha-response');
    const res = await fetch('https://formspree.io/f/maqpgkad', {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: formData
    });
    if (res.ok) {
      success.style.display = 'block';
      this.reset();
      grecaptcha.reset();
    } else {
      error.style.display = 'block';
    }
  } catch(err) {
    error.style.display = 'block';
  }
  btn.disabled = false;
});

window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 40);
});

// Init
setLang('he');
observeReveals();
</script>
