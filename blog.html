  he: {
    lang:'he', dir:'rtl',
    logoText:'בית אור',
    navBack:'← חזרה לאתר',
    heroEyebrow:'מאמרים',
    heroTitle:'קצת ידע לדרך',
    heroSub:'מאמרים על רפואה הוליסטית, צמחי מרפא וריפוי הגוף והנפש',
    footerLink:'← חזרה לבית אור',
    tag1:'רפואה סינית', title1:'מה זה דיקור סיני ואיך הוא עובד?',
    body1a:'דיקור סיני הוא ענף מרכזי ברפואה הסינית המסורתית, הנהוג כבר למעלה מ-2,500 שנה. הטיפול מבוסס על הכנסת מחטים דקות לנקודות ספציפיות לאורך מסלולי אנרגיה (מרידיאנים) בגוף, במטרה לשחרר חסימות ולהחזיר את זרימת האנרגיה החיונית לאיזון.',
    body1b:'דיקור סיני יעיל לכאבים כרוניים, כאבי גב, כאבי ראש ומיגרנות, חרדה ודיכאון, הפרעות שינה, בעיות עיכול, אי פוריות ועוד. המחטים דקות מאוד ורוב המטופלים מדווחים על תחושת רגיעה עמוקה במהלך הטיפול.',
    tag2:'שיאצו', title2:'שיאצו – הריפוי שבמגע',
    body2a:'שיאצו היא שיטת עיסוי יפנית המבוססת על עקרונות הרפואה הסינית המסורתית. המטפל משתמש בלחץ אצבעות, כפות ידיים ומרפקים לאורך מרידיאני האנרגיה בגוף. בניגוד לעיסויים אחרים, שיאצו מתבצע כשהמטופל לבוש ושוכב על מזרן רצפה.',
    body2b:'הטיפול משחרר מתחים, מחזק את מערכת החיסון, מפחית כאבים, משפר את זרימת הדם ומחזיר תחושת שלמות ורוגע עמוק. מתאים לכל גיל ומצב בריאותי, כולל נשים בהריון וקשישים.',
    tag3:'הרבליזם', title3:'צמחי מרפא – הרפואה שבטבע',
    body3a:'הרבליזם קליני הוא שימוש מדעי ומסורתי בצמחי מרפא לטיפול במצבים בריאותיים מגוונים. בבית אור, הפורמולות מותאמות אישית לכל מטופל לאחר הערכה מעמיקה הכוללת היסטוריה רפואית, אורח חיים ומצב רגשי.',
    body3b:'צמחי המרפא תומכים במערכת החיסון, מווסתים הורמונים, מחזקים את מערכת העצבים, משפרים את השינה ועוזרים במצבי עצבנות וחרדה. הפורמולות ניתנות כתמציות, תה צמחים או כמוסות.',
    tag4:'קונסטלציה משפחתית', title4:'קונסטלציה משפחתית – ריפוי דורי',
    body4a:'קונסטלציה משפחתית היא שיטת טיפול שפותחה על ידי ברט הלינגר, המאפשרת לראות ולרפא דינמיקות נסתרות במשפחה. הטיפול מבוסס על התובנה שאנחנו נושאים לעיתים עומסים רגשיים ודפוסים שלא שלנו — של הורים, סבים ואפילו אבות קדומים.',
    body4b:'באמצעות מייצגים (בקונסטלציה קבוצתית) או פסלים (בטיפול אישי), ניתן לגלות ולשחרר הזדהויות עם בני משפחה, לרפא פצעים דוריים ולמצוא את מקומך הנכון במשפחה. הטיפול יעיל במיוחד לקשיי זוגיות, הורות, תחושת חוסר שייכות וחרדה.',
    tag5:'רפואה הוליסטית', title5:'5 סיבות לנסות רפואה סינית',
    body5a:'1. טיפול בשורש הבעיה – הרפואה הסינית לא מכסה תסמינים, היא מחפשת ומטפלת בגורם העמוק. 2. מתאים לכמעט כל מצב – כאבים, חרדה, עייפות, בעיות הורמונליות, פוריות, עיכול ועוד. 3. ללא תופעות לוואי – הטיפולים טבעיים ובטוחים לרוב האוכלוסייה.',
    body5b:'4. מותאם אישית – כל טיפול בנוי לפי הצרכים הייחודיים שלך. 5. תוצאות מוכחות – מחקרים רבים מאששים את יעילות הדיקור הסיני והשיאצו למגוון מצבים רפואיים. בבית אור תקבל טיפול מקצועי, אישי ומכיל.',
    tag6:'השוואה', title6:'מה ההבדל בין דיקור סיני לשיאצו?',
    body6a:'שני הטיפולים מבוססים על עקרונות הרפואה הסינית ועובדים עם מרידיאני האנרגיה בגוף, אך הכלים שונים. דיקור סיני משתמש במחטים דקות המוכנסות לנקודות ספציפיות. שיאצו עובד עם לחץ ידיים על אותן נקודות ומרידיאנים.',
    body6b:'דיקור סיני מתאים יותר למצבים כרוניים ועמוקים, כאבים ובעיות פנימיות. שיאצו מתאים לשחרור מתחים, שיפור זרימה, הרפיה עמוקה ומי שמעדיף לא להשתמש במחטים. בבית אור, דריה מציעה את שני הטיפולים ותוכל להמליץ על המתאים לך.'
  },
  en: {
    lang:'en', dir:'ltr',
    logoText:'Beit Or',
    navBack:'← Back to Site',
    heroEyebrow:'Articles',
    heroTitle:'A Little Knowledge for the Journey',
    heroSub:'Articles on holistic medicine, medicinal herbs and healing body and mind',
    footerLink:'← Back to Beit Or',
    tag1:'Chinese Medicine', title1:'What is Acupuncture and How Does it Work?',
    body1a:'Acupuncture is a central branch of Traditional Chinese Medicine, practiced for over 2,500 years. Treatment involves inserting fine needles into specific points along energy pathways (meridians) in the body, releasing blockages and restoring the flow of vital energy to balance.',
    body1b:'Acupuncture is effective for chronic pain, back pain, headaches and migraines, anxiety and depression, sleep disorders, digestive issues, infertility and more. The needles are very fine and most patients report a deep sense of relaxation during treatment.',
    tag2:'Shiatsu', title2:'Shiatsu – The Healing Power of Touch',
    body2a:'Shiatsu is a Japanese massage method based on Traditional Chinese Medicine principles. The practitioner uses finger, palm and elbow pressure along the body\'s energy meridians. Unlike other massages, shiatsu is performed while the patient is clothed, lying on a floor mat.',
    body2b:'Treatment releases tension, strengthens the immune system, reduces pain, improves circulation and restores a deep sense of wholeness and calm. Suitable for all ages and health conditions, including pregnant women and the elderly.',
    tag3:'Herbal Medicine', title3:'Medicinal Herbs – Nature\'s Medicine',
    body3a:'Clinical herbalism is the scientific and traditional use of medicinal plants to treat a range of health conditions. At Beit Or, formulas are individually tailored to each patient after an in-depth assessment including medical history, lifestyle and emotional state.',
    body3b:'Herbs support the immune system, regulate hormones, strengthen the nervous system, improve sleep and help with anxiety and stress. Formulas are given as tinctures, herbal teas or capsules.',
    tag4:'Family Constellation', title4:'Family Constellation – Generational Healing',
    body4a:'Family Constellation is a therapeutic method developed by Bert Hellinger that allows us to see and heal hidden dynamics within the family. It is based on the insight that we sometimes carry emotional burdens and patterns that are not ours — belonging to parents, grandparents or even distant ancestors.',
    body4b:'Using representatives (in group constellation) or figurines (in individual sessions), it is possible to discover and release identifications with family members, heal generational wounds and find your rightful place in the family. Particularly effective for relationship difficulties, parenting challenges, feelings of not belonging and anxiety.',
    tag5:'Holistic Medicine', title5:'5 Reasons to Try Chinese Medicine',
    body5a:'1. Treating the root cause – Chinese medicine doesn\'t mask symptoms, it seeks and treats the deep underlying cause. 2. Suitable for almost any condition – pain, anxiety, fatigue, hormonal issues, fertility, digestion and more. 3. No side effects – treatments are natural and safe for most people.',
    body5b:'4. Personalised – every treatment is built around your unique needs. 5. Proven results – numerous studies confirm the effectiveness of acupuncture and shiatsu for a range of medical conditions. At Beit Or you will receive professional, personal and compassionate care.',
    tag6:'Comparison', title6:'What is the Difference Between Acupuncture and Shiatsu?',
    body6a:'Both treatments are based on Chinese Medicine principles and work with the body\'s energy meridians, but the tools differ. Acupuncture uses fine needles inserted at specific points. Shiatsu works with hand pressure on the same points and meridians.',
    body6b:'Acupuncture is better suited to chronic and deep conditions, pain and internal issues. Shiatsu is better for releasing tension, improving flow, deep relaxation and those who prefer not to use needles. At Beit Or, Daria offers both treatments and can recommend what is right for you.'
  }

function setLang(l) {
  const t = T[l];
  document.documentElement.lang = t.lang;
  document.documentElement.dir = t.dir;
  document.getElementById('logo-text').textContent = t.logoText;
  document.getElementById('nav-back-link').textContent = t.navBack;
  document.getElementById('hero-eyebrow').textContent = t.heroEyebrow;
  document.getElementById('hero-title').textContent = t.heroTitle;
  document.getElementById('hero-sub').textContent = t.heroSub;
  document.getElementById('footer-link').textContent = t.footerLink;
  for (let i = 1; i <= 6; i++) {
    document.getElementById('tag'+i).textContent = t['tag'+i];
    document.getElementById('title'+i).textContent = t['title'+i];
    document.getElementById('body'+i+'a').textContent = t['body'+i+'a'];
    document.getElementById('body'+i+'b').textContent = t['body'+i+'b'];
  }
  document.getElementById('btn-he').classList.toggle('active', l==='he');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
}

setLang('he');
