<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <clipPath id="mainClip">
      <circle cx="250" cy="250" r="216"/>
    </clipPath>
  </defs>

  <!-- White background -->
  <rect width="500" height="500" fill="white"/>
  <circle cx="250" cy="250" r="218" fill="white"/>

  <!-- Sun rays from center (250, 300) -->
  <g stroke="#C4845A" stroke-width="1.3" stroke-linecap="round" clip-path="url(#mainClip)">
    <!-- Long main rays -->
    <line x1="250" y1="238" x2="250" y2="140"/>
    <line x1="269" y1="241" x2="299" y2="148"/>
    <line x1="231" y1="241" x2="201" y2="148"/>
    <line x1="287" y1="250" x2="344" y2="171"/>
    <line x1="213" y1="250" x2="156" y2="171"/>
    <line x1="300" y1="264" x2="379" y2="206"/>
    <line x1="200" y1="264" x2="121" y2="206"/>
    <line x1="309" y1="281" x2="364" y2="263"/>
    <line x1="191" y1="281" x2="136" y2="263"/>
    <!-- Short tick rays between main rays -->
    <line x1="260" y1="239" x2="267" y2="191"/>
    <line x1="240" y1="239" x2="233" y2="191"/>
    <line x1="278" y1="245" x2="300" y2="202"/>
    <line x1="222" y1="245" x2="200" y2="202"/>
    <line x1="294" y1="256" x2="328" y2="222"/>
    <line x1="206" y1="256" x2="172" y2="222"/>
    <line x1="305" y1="272" x2="348" y2="250"/>
    <line x1="195" y1="272" x2="152" y2="250"/>
  </g>

  <!-- Sun circle -->
  <circle cx="250" cy="300" r="60" fill="white" stroke="#C4845A" stroke-width="1.5" clip-path="url(#mainClip)"/>

  <!-- Left hill outlines -->
  <path d="M 68 393 Q 130 358 192 345" fill="none" stroke="#C4845A" stroke-width="1.3" stroke-linecap="round" clip-path="url(#mainClip)"/>
  <path d="M 65 405 Q 128 370 192 358" fill="none" stroke="#C4845A" stroke-width="1.0" stroke-linecap="round" clip-path="url(#mainClip)" opacity="0.7"/>

  <!-- Right hill outlines -->
  <path d="M 308 345 Q 370 358 432 393" fill="none" stroke="#C4845A" stroke-width="1.3" stroke-linecap="round" clip-path="url(#mainClip)"/>
  <path d="M 308 358 Q 372 370 435 405" fill="none" stroke="#C4845A" stroke-width="1.0" stroke-linecap="round" clip-path="url(#mainClip)" opacity="0.7"/>

  <!-- Ground / horizon line -->
  <path d="M 68 393 Q 250 378 432 393" fill="none" stroke="#C4845A" stroke-width="1.2" clip-path="url(#mainClip)"/>

  <!-- House outer roof -->
  <path d="M 192 342 L 250 295 L 308 342"
        fill="white" stroke="#C4845A" stroke-width="1.6" stroke-linejoin="round" clip-path="url(#mainClip)"/>
  <!-- House inner roof (double line) -->
  <path d="M 202 342 L 250 303 L 298 342"
        fill="none" stroke="#C4845A" stroke-width="0.9" stroke-linejoin="round" clip-path="url(#mainClip)"/>
  <!-- Roof peak vertical line -->
  <line x1="250" y1="295" x2="250" y2="240" stroke="#C4845A" stroke-width="1.0" stroke-linecap="round" clip-path="url(#mainClip)" opacity="0.5"/>

  <!-- House body -->
  <rect x="204" y="342" width="92" height="57"
        fill="white" stroke="#C4845A" stroke-width="1.6" clip-path="url(#mainClip)"/>
  <!-- Door (centered, slightly taller) -->
  <rect x="235" y="365" width="30" height="34"
        fill="white" stroke="#C4845A" stroke-width="1.3" clip-path="url(#mainClip)"/>
  <!-- Left window -->
  <rect x="215" y="354" width="16" height="13" rx="1"
        fill="white" stroke="#C4845A" stroke-width="1.2" clip-path="url(#mainClip)"/>
  <!-- Right window -->
  <rect x="269" y="354" width="16" height="13" rx="1"
        fill="white" stroke="#C4845A" stroke-width="1.2" clip-path="url(#mainClip)"/>

  <!-- Left cypress tree -->
  <path d="M 163 298 C 179 324 181 366 176 393 L 150 393 C 145 366 147 324 163 298 Z"
        fill="white" stroke="#C4845A" stroke-width="1.3" clip-path="url(#mainClip)"/>
  <!-- Left tree texture dots -->
  <g fill="#C4845A" clip-path="url(#mainClip)">
    <circle cx="157" cy="330" r="1.5"/>
    <circle cx="168" cy="322" r="1.5"/>
    <circle cx="173" cy="342" r="1.5"/>
    <circle cx="156" cy="352" r="1.5"/>
    <circle cx="166" cy="360" r="1.5"/>
    <circle cx="152" cy="368" r="1.5"/>
    <circle cx="163" cy="375" r="1.5"/>
    <circle cx="171" cy="350" r="1.5"/>
    <circle cx="160" cy="338" r="1.5"/>
    <circle cx="170" cy="367" r="1.5"/>
  </g>

  <!-- Right cypress tree (mirrored) -->
  <path d="M 337 298 C 321 324 319 366 324 393 L 350 393 C 355 366 353 324 337 298 Z"
        fill="white" stroke="#C4845A" stroke-width="1.3" clip-path="url(#mainClip)"/>
  <!-- Right tree texture dots -->
  <g fill="#C4845A" clip-path="url(#mainClip)">
    <circle cx="343" cy="330" r="1.5"/>
    <circle cx="332" cy="322" r="1.5"/>
    <circle cx="327" cy="342" r="1.5"/>
    <circle cx="344" cy="352" r="1.5"/>
    <circle cx="334" cy="360" r="1.5"/>
    <circle cx="348" cy="368" r="1.5"/>
    <circle cx="337" cy="375" r="1.5"/>
    <circle cx="329" cy="350" r="1.5"/>
    <circle cx="340" cy="338" r="1.5"/>
    <circle cx="330" cy="367" r="1.5"/>
  </g>

  <!-- Outer ring (thicker) -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#7A4830" stroke-width="2.2"/>
  <!-- Inner thin ring -->
  <circle cx="250" cy="250" r="209" fill="none" stroke="#7A4830" stroke-width="0.75"/>

  <!-- Two decorative dots flanking text -->
  <circle cx="105" cy="213" r="3.5" fill="#7A4830"/>
  <circle cx="395" cy="213" r="3.5" fill="#7A4830"/>

  <!-- Hebrew text arc "בית אור" -->
  <path id="textArc" d="M 112 216 A 156 156 0 0 1 388 216" fill="none"/>
  <text font-size="31" fill="#7A4830" font-family="Georgia, 'Times New Roman', serif" letter-spacing="9">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">בית אור</textPath>
  </text>
</svg>
